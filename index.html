<!DOCTYPE html>
<html lang="la">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sententia diei</title>

    <!-- ============================
       Bootstrap CSS
       Provides responsive grid, utilities, and components
  ============================ -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- ============================
       Bootstrap Icons
       Provides iconography used throughout the UI
  ============================ -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- ============================
       Favicon
  ============================ -->
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />

    <!-- ============================
       Custom JavaScript
       Defer ensures scripts execute after HTML parsing
  ============================ -->
    <script src="js/fecha.js" defer></script>
    <!-- Date display logic -->
    <script src="js/copiar.js" defer></script>
    <!-- Clipboard copy functionality -->
    <script src="js/lecturajson.js" defer></script>
    <!-- Main logic: load and display quotes -->
    <script src="js/buscar.js" defer></script>
    <!-- Search/filter logic -->
    <script src="js/imprimir.js" defer></script>
    <!-- Export to PNG/PDF functionality -->

    <!-- ============================
       Bootstrap JS Bundle
       Includes Popper for tooltips, dropdowns, modals, etc.
  ============================ -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
  </head>

  <body class="d-flex flex-column min-vh-100 bg-light">
    <!-- ============================
       Header Section
       Contains site title, GitHub link, version badge, and search form
  ============================ -->
    <header class="bg-white shadow-sm py-3">
      <div class="container">
        <div class="row align-items-center">
          <div
            class="col-md-4 d-flex flex-column align-items-center align-items-md-start gap-1"
          >
            <h1 class="h4 fw-bold text-primary mb-0">Sententia diei</h1>
            <div class="d-flex align-items-center gap-2">
              <a
                href="#"
                onclick="abrirEnNavegador(event, 'https://github.com/danloi2/sententia')"
                class="text-muted d-flex align-items-center"
                data-bs-toggle="tooltip"
                title="GitHub Repository"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  fill="currentColor"
                  class="bi bi-github"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"
                  />
                </svg>
              </a>
              <img
                src="https://img.shields.io/github/v/tag/danloi2/sententia?label=Release&color=0d6efd&style=flat-square"
                alt="Version"
                height="18"
                data-bs-toggle="tooltip"
                title="Latest Version"
              />
            </div>
          </div>

          <!-- Center: Current date -->
          <div class="col-md-4 text-center mt-2 mt-md-0">
            <span id="fecha" class="fs-5 fw-semibold text-primary d-block lh-sm"
              >Cargando fecha…</span
            >
          </div>

          <!-- Right: Search form -->
          <div
            class="col-md-4 d-flex justify-content-center justify-content-md-end mt-2 mt-md-0"
          >
            <form class="d-flex" role="search">
              <input
                id="inputBuscar"
                class="form-control form-control-sm me-2"
                type="search"
                placeholder="Quaerere per auctorem, aetatem…"
                aria-label="Search"
              />
              <button class="btn btn-sm btn-outline-success" type="submit">
                Quaerere
              </button>
            </form>
          </div>
        </div>
      </div>
    </header>

    <!-- ============================
       Main Section
       Contains quote container and statistics
  ============================ -->
    <main class="container flex-grow-1 my-4">
      <!-- Quote container (populated dynamically via lecturajson.js) -->
      <div id="cita-container" class="row justify-content-center">
        <div class="text-center">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="mt-2 text-muted small fst-italic">
            Investigando sapientiam...
          </p>
        </div>
      </div>

      <!-- Statistics container (number of quotes, authors, etc.) -->
      <div id="stats-container" class="fade-in mt-4"></div>
    </main>

    <!-- ============================
       Footer Section
       Contains Creative Commons license and author credit
  ============================ -->
    <footer class="mt-auto bg-white border-top shadow-sm py-4">
      <div class="container">
        <div class="row text-center text-md-start align-items-center">
          <!-- Left: CC License -->
          <div
            class="col-md-6 d-flex flex-column flex-md-row align-items-center justify-content-center justify-content-md-start gap-2"
          >
            <a
              href="https://creativecommons.org/licenses/by-sa/4.0/"
              target="_blank"
              class="text-decoration-none fw-medium"
              >CC BY-SA 4.0</a
            >
            <div class="d-flex align-items-center gap-1">
              <img
                src="https://mirrors.creativecommons.org/presskit/icons/cc.svg"
                alt="CC"
                height="20"
              />
              <img
                src="https://mirrors.creativecommons.org/presskit/icons/by.svg"
                alt="BY"
                height="20"
              />
              <img
                src="https://mirrors.creativecommons.org/presskit/icons/sa.svg"
                alt="SA"
                height="20"
              />
            </div>
          </div>

          <!-- Right: Author credit -->
          <div class="col-md-6 mt-3 mt-md-0 text-center text-md-end">
            <a
              href="https://ekoizpen-zientifikoa.ehu.eus/investigadores/130988/detalle"
              target="_blank"
              class="text-decoration-none text-muted fw-medium"
            >
              Daniel Losada © 2025
            </a>
          </div>
        </div>
      </div>
    </footer>

    <!-- ============================
       Modal for displaying quote images
       Populated dynamically when clicking an image
  ============================ -->
    <div class="modal fade" id="imagenModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-body text-center">
            <img id="modalImagen" src="" class="img-fluid rounded" alt="" />
            <div
              id="modalAtribucion"
              class="small text-muted fst-italic mt-2"
            ></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ============================
       Initialize Bootstrap tooltips
  ============================ -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const tooltipTriggerList = [].slice.call(
          document.querySelectorAll('[data-bs-toggle="tooltip"]')
        );
        tooltipTriggerList.map(function (tooltipTriggerEl) {
          return new bootstrap.Tooltip(tooltipTriggerEl);
        });
      });
    </script>

    <!-- ============================
       Libraries for export functionality
       html2canvas: Render HTML to Canvas for image/PDF export
       jsPDF: Generate PDF files from Canvas
  ============================ -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  </body>
</html>
