<!DOCTYPE html>
<html lang="la">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sententia diei</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />

    <!-- Scripts propios -->
    <script src="js/fecha.js" defer></script>
    <script src="js/copiar.js" defer></script>
    <script src="js/lecturajson.js" defer></script>
    <script src="js/buscar.js" defer></script>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
  </head>

  <body class="d-flex flex-column min-vh-100 bg-light">
    <!-- ===== Header ===== -->
    <header class="bg-white shadow-sm py-3">
      <div class="container">
        <div class="row align-items-center">
          <!-- Logo con GitHub y versión debajo -->
          <div
            class="col-md-4 d-flex flex-column align-items-center align-items-md-start gap-2"
          >
            <h1 class="h4 fw-bold text-primary mb-1">Sententia diei</h1>
            <div class="d-flex align-items-center gap-2">
              <a
                href="https://github.com/danloi2/sententia"
                target="_blank"
                class="text-muted fs-5"
                data-bs-toggle="tooltip"
                title="Repositorium"
              >
                <i class="bi bi-github"></i>
              </a>
              <a
              href="https://github.com/danloi2/sententia/releases/latest"
              target="_blank"
              data-bs-toggle="tooltip"
              title="Editio"
              >
              <img
              src="https://img.shields.io/github/v/release/danloi2/sententia?style=flat"
              alt="Version"
              class="rounded-badge"
              />
              </a>

            </div>
          </div>

          <!-- Fecha -->
          <div class="col-md-4 text-center mt-2 mt-md-0">
            <span
              id="fecha"
              class="fs-5 fw-semibold text-primary d-block lh-sm"
            >
              Cargando fecha…
            </span>
          </div>

          <!-- Buscador -->
          <div
            class="col-md-4 d-flex justify-content-center justify-content-md-end mt-2 mt-md-0"
          >
            <form class="d-flex" role="search">
              <input
                id="inputBuscar"
                class="form-control form-control-sm me-2"
                type="search"
                placeholder="Quaerere per auctorem, aetatem…"
                aria-label="Search"
              />
              <button class="btn btn-sm btn-outline-success" type="submit">
                Quaerere
              </button>
            </form>
          </div>
        </div>
      </div>
    </header>

    <!-- ===== Main ===== -->
    <main class="container flex-grow-1 my-4">
      <!-- Spinner de carga -->
      <div id="cita-container" class="row justify-content-center">
        <div class="text-center">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="mt-2 text-muted small fst-italic">
            Investigando sapientiam...
          </p>
        </div>
      </div>

      <!-- Stats -->
      <div id="stats-container" class="fade-in mt-4"></div>
    </main>

    <!-- ===== Footer ===== -->
    <footer class="mt-auto bg-white border-top shadow-sm py-4">
      <div class="container">
        <div class="row text-center text-md-start align-items-center">
          <div
            class="col-md-6 d-flex flex-column flex-md-row align-items-center justify-content-center justify-content-md-start gap-2"
          >
            <a
              href="https://creativecommons.org/licenses/by-sa/4.0/"
              target="_blank"
              class="text-decoration-none fw-medium"
              >CC BY-SA 4.0</a
            >
            <div class="d-flex align-items-center gap-1">
              <img
                src="https://mirrors.creativecommons.org/presskit/icons/cc.svg"
                alt="CC"
                height="20"
              />
              <img
                src="https://mirrors.creativecommons.org/presskit/icons/by.svg"
                alt="BY"
                height="20"
              />
              <img
                src="https://mirrors.creativecommons.org/presskit/icons/sa.svg"
                alt="SA"
                height="20"
              />
            </div>
          </div>

          <div class="col-md-6 mt-3 mt-md-0 text-center text-md-end">
            <a
              href="https://ekoizpen-zientifikoa.ehu.eus/investigadores/130988/detalle"
              target="_blank"
              class="text-decoration-none text-muted fw-medium"
            >
              Daniel Losada © 2025
            </a>
          </div>
        </div>
      </div>
    </footer>

    <!-- Inicializar tooltips Bootstrap -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const tooltipTriggerList = [].slice.call(
          document.querySelectorAll('[data-bs-toggle="tooltip"]')
        );
        tooltipTriggerList.map(function (tooltipTriggerEl) {
          return new bootstrap.Tooltip(tooltipTriggerEl);
        });
      });
    </script>
  </body>
</html>
