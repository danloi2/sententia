name: Build Tauri App
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Prepare assets (Fix for Tauri v2 root error)
        shell: bash
        run: |
          # 1. Crear carpeta limpia
          mkdir -p dist_temp
          
          # 2. Copiar archivos sueltos de la raíz DIRECTO a dist_temp
          cp index.html dist_temp/ 2>/dev/null || true
          cp *.js dist_temp/ 2>/dev/null || true
          cp *.css dist_temp/ 2>/dev/null || true
          cp *.json dist_temp/ 2>/dev/null || true
          
          # 3. Copiar carpetas completas DENTRO de dist_temp
          [ -d js ] && cp -r js dist_temp/
          [ -d db ] && cp -r db dist_temp/
          [ -d assets ] && cp -r assets dist_temp/
          
          # 4. Verificación crucial: Si esto sale vacío en los logs, la app saldrá blanca
          echo "--- CONTENIDO FINAL DE DIST_TEMP ---"
          ls -F dist_temp

      - name: Build Tauri App
        run: npm run build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/setup.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
