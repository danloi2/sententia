# ------------------------------
# GitHub Actions Workflow: Build Tauri App
# ------------------------------

name: Build Tauri App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Nota: Ubuntu generará DEB, RPM y AppImage
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      # 1. Descargar el código
      - uses: actions/checkout@v4

      # 2. Configurar Node.js (necesario para procesar imágenes y Tauri)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Instalar Rust (necesario para el núcleo de Tauri)
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # 4. Instalar dependencias de Linux (Solo en Ubuntu)
      # Aquí hemos añadido 'rpm' para que pueda generar ese paquete
      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            librpm-dev \
            rpm

      # 5. Instalar dependencias de Node.js
      # Esto instala sharp, potrace, imagetracerjs, etc.
      - name: Install frontend dependencies
        run: npm install

      # 6. Compilar la App
      # Si pusiste "npm run process-imgs" en beforeBuildCommand de tauri.conf.json,
      # este paso generará automáticamente los PNG y SVG antes de compilar.
      - name: Build Tauri App
        run: npm run build

      # 7. Guardar los archivos generados (Artifacts)
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/setup.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage


