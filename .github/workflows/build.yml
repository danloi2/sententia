# ------------------------------
# GitHub Actions Workflow: Build Tauri App
# ------------------------------

name: Build Tauri App

# Trigger workflow on push or pull request to main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # Run jobs on multiple platforms in parallel
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      # ------------------------------
      # Step 1: Checkout repository
      # ------------------------------
      - uses: actions/checkout@v4

      # ------------------------------
      # Step 2: Setup Node.js
      # ------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # ------------------------------
      # Step 3: Install Rust (stable)
      # Required for building Tauri apps
      # ------------------------------
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # ------------------------------
      # Step 4: Install Linux dependencies (GTK/WebKit etc.)
      # Only needed on Ubuntu
      # ------------------------------
      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # ------------------------------
      # Step 5: Install frontend dependencies
      # ------------------------------
      - name: Install frontend dependencies
        run: npm install

      # ------------------------------
      # Step 6: Build Tauri App
      # This will generate all bundles: DEB, RPM, AppImage, MSI, DMG
      # ------------------------------
      - name: Build Tauri App
        run: npm run build

      # ------------------------------
      # Step 7: Upload artifacts
      # Collect installers for each platform
      # ------------------------------
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/setup.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage


