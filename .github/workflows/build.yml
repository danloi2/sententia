name: Build Tauri App
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Prepare assets (Fix for Tauri v2 root error)
        shell: bash
        run: |
          mkdir dist_temp
          # Copia archivos sueltos de la raíz
          cp *.html *.json 2>/dev/null || true
          
          # Copia carpetas completas de forma recursiva
          cp -r js dist_temp/ 2>/dev/null || true
          cp -r db dist_temp/ 2>/dev/null || true
          cp -r assets dist_temp/ 2>/dev/null || true
          
          # Copia cualquier archivo html/js/css que haya quedado en la raíz
          cp *.html *.js *.css dist_temp/ 2>/dev/null || true

          echo "Estructura empaquetada:"
          ls -R dist_temp

      - name: Build Tauri App
        run: npm run build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/setup.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
